<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Ícono para el navegador y Android -->
<link rel="icon" type="image/png" sizes="192x192" href="icono.png">
<!-- Ícono específico cuando se añade a la pantalla de inicio en Android/iOS -->
<link rel="apple-touch-icon" href="icono.png">
  
  <meta charset="UTF-8">
  <title>Mi Colección de Audios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; text-align: center; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0 5px; font-size: 1.1em; }
    .card p { color: #aaa; margin: 0 0 10px; font-size: 0.9em; }
    audio { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Mis Grabaciones</h1>
  <div id="playlist" class="grid"></div>

  <script>
    // Lista de tus archivos MP3 guardados en la carpeta audios/
    const canciones = [
      "audios/grabacion1.mp3",
      "audios/grabacion2.mp3"
    ];

    const jsMediaTags = window.jsmediatags;
    const container = document.getElementById("playlist");

    canciones.forEach(src => {
      jsMediaTags.read(src, {
        onSuccess: function(tag) {
          const tags = tag.tags;
          const title = tags.title || src.split('/').pop();
          const artist = tags.artist || "Autor desconocido";
          
          let imageSrc = "https://via.placeholder.com/200?text=Audio";
          if (tags.picture) {
            const { data, format } = tags.picture;
            let base64String = "";
            for (let i = 0; i < data.length; i++) {
              base64String += String.fromCharCode(data[i]);
            }
            imageSrc = `data:${format};base64,${btoa(base64String)}`;
          }

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${imageSrc}" alt="${title}">
            <h3>${title}</h3>
            <p>${artist}</p>
            <audio controls src="${src}"></audio>
          `;
          container.appendChild(card);
        },
        onError: function(error) {
          console.log('Error leyendo etiquetas:', error);
        }
      });
    });
  </script>
</body>
</html>
