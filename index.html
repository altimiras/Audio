<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Música Altimiras</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0969da">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
  :root{
    --fondo:#111018;
    --fondo-fila:#1b1926;
    --fondo-fila-activa:#232037;
    --borde:#312e45;
    --texto:#f1eef9;
    --texto-tenue:#918cae;
    --violeta:#8b5cf6;
    --rosa:#ec4899;
    --cian:#22d3ee;
    --naranja:#fb923c;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 85% 0%, rgba(139,92,246,0.18) 0%, transparent 45%),
      radial-gradient(circle at 10% 15%, rgba(236,72,153,0.14) 0%, transparent 40%),
      var(--fondo);
    color:var(--texto);
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    padding-bottom:110px;
    min-height:100vh;
  }

  /* ---------- Cinta superior ---------- */
  .cinta{
    position:relative;
    padding:22px 20px;
    background:linear-gradient(100deg, #6d28d9 0%, #a21caf 32%, #db2777 58%, #f97316 100%);
    background-size:220% 220%;
    animation:mover-cinta 12s ease infinite;
    overflow:hidden;
  }
  @keyframes mover-cinta{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .cinta::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 100%);
  }
  .cinta h1{
    position:relative;
    margin:0;
    font-size:1.55rem;
    font-weight:800;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cinta h1 .nota{
    font-size:1.3rem;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }

  #estado{ padding:16px 20px; color:var(--texto-tenue); font-size:0.9rem; }
  #estado.error{color:#f87171;}

  #lista{ display:flex; flex-direction:column; padding:10px 14px 20px; gap:4px; }

  .fila{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 10px;
    border-radius:14px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .fila:active{ transform:scale(0.985); }
  .fila.activa{
    background:var(--fondo-fila-activa);
    border-color:var(--violeta);
    box-shadow:0 4px 18px rgba(139,92,246,0.25);
  }
  .fila:not(.activa):active{ background:var(--fondo-fila); }

  .caratula-wrap{
    position:relative;
    width:60px; height:60px;
    border-radius:10px;
    overflow:hidden;
    background:linear-gradient(135deg, #2a2740, #191725);
    flex-shrink:0;
  }
  .caratula-wrap img{ width:100%;height:100%;object-fit:cover;display:block; }
  .caratula-wrap .sin-caratula{
    width:100%;height:100%; display:flex;align-items:center;justify-content:center;
    color:var(--texto-tenue); font-size:1.4rem;
  }
  .marca-play{
    position:absolute; right:3px;bottom:3px; width:20px;height:20px; border-radius:50%;
    background:linear-gradient(135deg, var(--rosa), var(--naranja));
    display:flex;align-items:center;justify-content:center;
    opacity:0; transition:opacity .15s ease;
  }
  .fila.activa .marca-play{opacity:1;}
  .marca-play svg{width:10px;height:10px;fill:#fff;}

  .fila .info{ min-width:0; flex:1; }
  .fila .titulo{
    font-size:0.98rem; font-weight:600; line-height:1.3; margin:0;
    color:var(--texto);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fila .autor{
    margin:3px 0 0; font-size:0.78rem; color:var(--texto-tenue);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #reproductor{
    position:fixed; left:0;right:0;bottom:0;
    background:#181622;
    border-top:1px solid var(--borde);
    padding:10px 14px 14px;
    display:none;
    align-items:center; gap:12px;
    box-shadow:0 -6px 24px rgba(0,0,0,0.35);
  }
  #reproductor.visible{display:flex;}
  #reproductor img{ width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0; }
  #reproductor .datos{ flex:1; min-width:0; }
  #reproductor .titulo-actual{
    font-size:0.85rem; font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(90deg, var(--cian), var(--violeta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #reproductor audio{ width:100%; height:32px; margin-top:4px; }

  #vacio{
    padding:40px 20px; text-align:center; color:var(--texto-tenue);
    font-size:0.9rem; line-height:1.6;
  }
  code{ background:#211f30; padding:1px 6px; border-radius:4px; color:var(--cian); }
</style>
</head>
<body>

<div class="cinta">
  <h1><span class="nota">🎵</span>Música Altimiras</h1>
</div>

<div id="estado">Cargando…</div>

<div id="lista"></div>
<div id="vacio" style="display:none;"></div>

<div id="reproductor">
  <img id="rep-caratula" src="" alt="">
  <div class="datos">
    <div class="titulo-actual" id="rep-titulo">—</div>
    <audio id="rep-audio" controls preload="metadata"></audio>
  </div>
</div>

<script>
const RAMA_POR_DEFECTO = "main";
const CARPETA_MP3 = "mp3";

function obtenerConfiguracion(){
  const host = location.hostname;
  const partesRuta = location.pathname.split("/").filter(Boolean);
  const usuario = host.split(".")[0];
  const repositorio = partesRuta.length > 0 ? partesRuta[0] : host;
  return {usuario, repositorio, rama: RAMA_POR_DEFECTO, carpetaMp3: CARPETA_MP3};
}

function tituloDesdeArchivo(ruta){
  const archivo = ruta.split("/").pop();
  const sinExt = archivo.substring(0, archivo.lastIndexOf(".")) || archivo;
  return sinExt.replace(/[_\-]+/g," ").trim().replace(/\b\w/g, l => l.toUpperCase());
}

async function cargarCancionero(){
  const cfg = obtenerConfiguracion();
  const estado = document.getElementById("estado");

  try{
    const urlArbol = `https://api.github.com/repos/${cfg.usuario}/${cfg.repositorio}/git/trees/${cfg.rama}?recursive=1`;
    const resp = await fetch(urlArbol);
    if(!resp.ok){
      throw new Error(resp.status === 404
        ? "No se encontró el repositorio o la rama indicada."
        : `Error de GitHub (${resp.status}).`);
    }
    const datos = await resp.json();
    const items = datos.tree || [];

    const mp3s = items.filter(i => i.type === "blob" &&
      i.path.startsWith(cfg.carpetaMp3 + "/") &&
      i.path.toLowerCase().endsWith(".mp3"));

    if(mp3s.length === 0){
      estado.style.display = "none";
      const vacio = document.getElementById("vacio");
      vacio.style.display = "block";
      vacio.innerHTML = `Aún no hay canciones en <code>${cfg.carpetaMp3}/</code>.`;
      return;
    }

    const base = `https://raw.githubusercontent.com/${cfg.usuario}/${cfg.repositorio}/${cfg.rama}/`;
    const canciones = mp3s
      .map(m => ({
        ruta: m.path,
        titulo: tituloDesdeArchivo(m.path),
        artista: "",
        urlAudio: base + m.path,
        urlCaratula: null
      }))
      .sort((a,b) => a.titulo.localeCompare(b.titulo, "es"));

    estado.style.display = "none";
    renderizarLista(canciones);

  }catch(err){
    estado.textContent = "No se pudo cargar el cancionero: " + err.message;
    estado.classList.add("error");
  }
}

function renderizarLista(canciones){
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  canciones.forEach((cancion, indice) => {
    const fila = document.createElement("div");
    fila.className = "fila";
    fila.dataset.indice = indice;
    fila.innerHTML = `
      <div class="caratula-wrap">
        <div class="sin-caratula">♪</div>
        <div class="marca-play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="info">
        <p class="titulo">${cancion.titulo}</p>
        <p class="autor"></p>
      </div>
    `;
    fila.addEventListener("click", () => reproducir(canciones[indice], fila));
    lista.appendChild(fila);

    // Se lee la etiqueta de inmediato, sin esperar a que se toque la fila.
    leerEtiquetasId3(cancion, fila);
  });
}

async function leerEtiquetasId3(cancion, fila){
  if(typeof jsmediatags === "undefined") return;

  try{
    const respuesta = await fetch(cancion.urlAudio);
    if(!respuesta.ok) throw new Error("No se pudo descargar el mp3");
    const blob = await respuesta.blob();

    jsmediatags.read(blob, {
      onSuccess: function(tag){
        const t = tag.tags || {};

        if(t.title){
          cancion.titulo = t.title;
          fila.querySelector(".titulo").textContent = t.title;
        }
        if(t.artist){
          cancion.artista = t.artist;
          fila.querySelector(".autor").textContent = t.artist;
        }
        if(t.picture){
          const {data, format} = t.picture;
          let urlImagen = null;

          if(format === "-->"){
            urlImagen = new TextDecoder("utf-8").decode(new Uint8Array(data)).trim();
          } else if(data && data.length){
            const bytes = new Uint8Array(data);
            const blobImagen = new Blob([bytes], {type: format || "image/jpeg"});
            urlImagen = URL.createObjectURL(blobImagen);
          }

          if(urlImagen){
            cancion.urlCaratula = urlImagen;
            const envoltorio = fila.querySelector(".caratula-wrap");

            const img = document.createElement("img");
            img.alt = cancion.titulo;
            img.referrerPolicy = "no-referrer";
            img.onload = () => {
              const marcador = envoltorio.querySelector(".sin-caratula");
              if(marcador) marcador.remove();
              // Fuerza un reflow para que algunos navegadores móviles
              // pinten la imagen de inmediato, sin esperar una interacción.
              void envoltorio.offsetHeight;
            };
            img.onerror = () => { img.remove(); };
            envoltorio.prepend(img);
            img.src = urlImagen;
          }
        }
      },
      onError: function(error){
        console.warn("Sin etiquetas ID3 legibles en", cancion.ruta, error);
      }
    });
  }catch(err){
    console.warn("No se pudieron leer etiquetas de", cancion.ruta, err);
  }
}

function reproducir(cancion, elementoFila){
  document.querySelectorAll(".fila.activa").forEach(f => f.classList.remove("activa"));
  elementoFila.classList.add("activa");

  const reproductor = document.getElementById("reproductor");
  const audio = document.getElementById("rep-audio");
  const titulo = document.getElementById("rep-titulo");
  const caratula = document.getElementById("rep-caratula");

  titulo.textContent = cancion.titulo + (cancion.artista ? " — " + cancion.artista : "");
  caratula.src = cancion.urlCaratula || "";
  caratula.style.visibility = cancion.urlCaratula ? "visible" : "hidden";
  audio.src = cancion.urlAudio;
  reproductor.classList.add("visible");
  audio.play().catch(()=>{ /* el navegador puede requerir un toque previo */ });
}

cargarCancionero();
</script>

</body>
</html>
